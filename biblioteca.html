<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Biblioteca</title>
    <style>
      body {
        background: rgb(15, 15, 15);
        color: #fff;
        font-family: sans-serif;
        margin: 0;
        padding: 15px;
      }
      h2 {
        margin-bottom: 10px;
      }
      .btn-playlist {
        display: block;
        width: 100%;
        margin: 10px 0;
        padding: 10px;
        background-color: #1db954;
        color: black;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-align: center;
        transition: transform 0.2s ease;
      }
      .btn-playlist:hover {
        transform: scale(1.05);
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        padding: 8px;
        border-bottom: 1px solid #222;
        cursor: pointer;
      }
      li:hover {
        background: #111;
      }
      /* Prevent mobile text selection and touch-callout on playlist items */
      #listaPlaylists li {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
      #formNueva {
        margin-top: 15px;
        display: none;
      }
      #formNueva input {
        width: 100%;
        padding: 8px;
        margin-bottom: 6px;
        border-radius: 6px;
        border: none;
        background: #222;
        color: #fff;
      }
      #formNueva button {
        background-color: #1db954;
        border: none;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      /* modal will be rendered by the parent (index.html) overlay */
    </style>
  </head>
  <body class="biblioteca">
    <h2>Mi Biblioteca</h2>

    <button class="btn-playlist" id="nuevaPlaylistBtn">+ Nueva Playlist</button>

    <!-- Modal is rendered by the parent overlay -->

    <ul id="listaPlaylists"></ul>

    <!-- API -->
    <script src="api.js"></script>

    <script>
      const lista = document.getElementById("listaPlaylists");
      const btnNueva = document.getElementById("nuevaPlaylistBtn");
      // we'll receive create requests from parent overlay via postMessage
      const btnCrear = null;

      (async function init() {
        const ok = await requireAuth();
        if (!ok) return;
        await cargarPlaylists();
      })();

      async function cargarPlaylists() {
        try {
          const r = await api.playlists();
          lista.innerHTML = "";
          if (!r.playlists || r.playlists.length === 0) {
            lista.innerHTML = `<li style="color:#888;">No tenés playlists todavía</li>`;
            return;
          }
          r.playlists.forEach((pl) => {
            const li = document.createElement("li");
            li.textContent = pl.nombre;
            li.dataset.plId = pl.id;
            li.dataset.plName = pl.nombre || '';
            li.addEventListener("click", () => {
              window.parent.frames[
                "contenidoFrame"
              ].location.href = `playlist.html?id=${pl.id}`;
            });
            li.addEventListener('contextmenu', (ev) => {
              ev.preventDefault();
              ev.stopPropagation();
              // send request to parent to open context menu at mouse position
              try {
                window.parent.postMessage({ type: 'open-playlist-context', id: pl.id, name: pl.nombre || '', x: ev.clientX, y: ev.clientY }, '*');
              } catch (e) {}
            });
            lista.appendChild(li);
          });
        } catch (e) {
          console.error(e);
          lista.innerHTML = `<li style="color:red;">Error al cargar playlists</li>`;
        }
      }

        // Prevent native text selection (selectstart) on playlist items
        document.addEventListener('selectstart', (ev) => {
          try {
            if (ev.target && ev.target.closest && ev.target.closest('#listaPlaylists li')) ev.preventDefault();
          } catch (e) {}
        });

      // When user clicks the button, request parent to open a global modal
      btnNueva.addEventListener('click', () => {
        const rect = btnNueva.getBoundingClientRect();
        // send rect so parent can compute absolute position and animate bubble from the button
        window.parent.postMessage({ type: 'open-create-playlist', btnRect: { left: rect.left, top: rect.top, width: rect.width, height: rect.height } }, '*');
      });

      // Listen for create requests coming from parent overlay
      window.addEventListener('message', async (ev) => {
        const d = ev.data || {};
        if (d.type === 'create-playlist') {
          const nombre = (d.name || '').trim();
          if (!nombre) {
            // reply with error
            ev.source.postMessage({ type: 'create-playlist-result', ok: false, error: 'Nombre vacío' }, '*');
            return;
          }
          try {
            const res = await api.createPl(nombre);
            // notify parent of success
            ev.source.postMessage({ type: 'create-playlist-result', ok: true, id: res.id }, '*');
            // refresh local list
            await cargarPlaylists();
          } catch (e) {
            ev.source.postMessage({ type: 'create-playlist-result', ok: false, error: e.error || String(e) }, '*');
          }
        }
        // actions from parent context menu
        if (d.type === 'playlist-action') {
          const id = d.id;
          const action = d.action;
          if (!id || !action) return;
          try {
            if (action === 'rename') {
              const nuevo = prompt('Nuevo nombre para la playlist', d.name || '');
              if (!nuevo) return ev.source.postMessage({ type: 'playlist-action-result', ok: false, error: 'Nombre vacío' }, '*');
              await api.renamePl(id, nuevo);
              await cargarPlaylists();
              ev.source.postMessage({ type: 'playlist-action-result', ok: true });
            } else if (action === 'empty') {
              if (!confirm('Vaciar la playlist? Esta acción no se puede deshacer.')) return;
              await api.clearPl(id);
              await cargarPlaylists();
              ev.source.postMessage({ type: 'playlist-action-result', ok: true });
            } else if (action === 'delete') {
              if (!confirm('Eliminar la playlist? Esta acción no se puede deshacer.')) return;
              await api.delPl(id);
              await cargarPlaylists();
              ev.source.postMessage({ type: 'playlist-action-result', ok: true });
            }
          } catch (err) {
            console.error(err);
            ev.source.postMessage({ type: 'playlist-action-result', ok: false, error: err?.error || String(err) }, '*');
          }
        }
      });
    </script>
  </body>
</html>
