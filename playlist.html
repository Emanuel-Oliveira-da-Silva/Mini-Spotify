<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Playlist</title>
    <style>
      /* Flecha volver */
      .volver {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 24px;
        color: white;
        cursor: pointer;
        user-select: none;
      }
      .volver:hover {
        color: #1db954;
      }

      /* Contenedor título y opciones: mejor distribución */
      .header-playlist {
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
        margin-top: 28px;
        margin-bottom: 6px;
        gap: 12px;
      }

      /* Título centrado y flexible */
      #tituloPlaylist {
        font-size: 28px;
        color: white;
        text-align: center;
        flex: 1 1 auto;
        margin: 0 12px;
      }

      /* Botón + Agregar canción */
      #btnAgregarCancion {
        display: inline-block;
        padding: 10px 18px;
        font-size: 15px;
        background-color: #1db954;
        color: black;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 800;
        box-shadow: 0 8px 20px rgba(29,185,84,0.08);
      }
      #btnAgregarCancion:hover { transform: translateY(-2px); }

      /* Controls grouping (add + shuffle) */
      .controls-bar { display:flex; gap:12px; align-items:center; }

      /* Mini menú para agregar canciones (ahora más grande y responsive) */
      #miniCanciones {
        display: none;
        position: absolute;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        width: 92%;
        max-width: 1280px;
        height: 78%;
        overflow: auto;
        background-color: rgba(15, 15, 15, 0.98);
        border-radius: 14px;
        padding: 22px;
        z-index: 1400;
        /* layout when open will be block; keep CSS default hidden */
        box-shadow: 0 22px 50px rgba(0, 0, 0, 0.65);
      }

      /* Lista de canciones en mini menú: grid con thumbnails grandes */
      #listaMiniCanciones {
        margin-top: 12px;
        overflow-y: auto;
        padding-right: 8px;
        display: grid;
        grid-auto-rows: minmax(180px, auto);
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 22px 24px; /* row-gap col-gap */
        align-items: start;
        justify-items: center;
      }

      #listaMiniCanciones .cancion {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        margin: 0;
        padding: 12px 8px;
        cursor: pointer;
        border-radius: 10px;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
        background: linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
      }

      #listaMiniCanciones .cancion:hover {
        transform: translateY(-6px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      }

      #listaMiniCanciones .cancion img {
        width: 140px;
        height: 140px;
        border-radius: 10px;
        object-fit: cover;
        display: block;
      }

      #listaMiniCanciones .cancion p {
        margin: 0;
        font-size: 15px;
        text-align: center;
        color: white;
      }

      /* Backdrop that dims the page when menu is open */
      #menuBackdrop {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.4);
        z-index: 1300;
      }

      /* Opciones playlist (3 puntos) */
      .menu-opciones {
        position: absolute;
        top: 0;
        right: 10px;
        font-size: 24px;
        color: white;
        cursor: pointer;
      }
      .menu-opciones:hover {
        color: #1db954;
      }
      .miniMenuOpciones {
        display: none;
        position: absolute;
        top: 30px;
        right: 0;
        background-color: #2a2a2a;
        border-radius: 8px;
        padding: 5px;
        flex-direction: column;
        z-index: 100;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .miniMenuOpciones button {
        background: none;
        border: none;
        color: white;
        padding: 6px 10px;
        cursor: pointer;
        text-align: left;
      }
      .miniMenuOpciones button:hover {
        background-color: #1db954;
        color: black;
      }

      /* Notificación */
      #notificacion {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #1db954;
        color: black;
        padding: 10px 20px;
        border-radius: 8px;
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      /* Lista de canciones de la playlist */
      /* Lista de canciones de la playlist (grid responsive de columnas) */
      #listaCanciones {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 18px 22px;
        align-items: start;
        padding: 18px 8px 28px 8px;
      }

      #listaCanciones .cancion {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        margin: 0;
        padding: 8px;
        cursor: pointer;
        position: relative;
      }

      #listaCanciones .cancion img {
        width: 140px;
        height: 140px;
        border-radius: 10px;
        object-fit: cover;
        display: block;
        box-shadow: 0 6px 26px rgba(0,0,0,0.45);
      }

      #listaCanciones .cancion p {
        margin: 0;
        font-size: 13px;
        text-align: center;
        color: white;
      }

      /* Reorder / jiggle mode */
      .reorder-mode .cancion {
        animation: jiggle 0.14s infinite;
        cursor: grab;
        user-select: none;
        touch-action: none; /* allow pointer dragging without browser gestures */
      }
      /* normal behavior: allow vertical scroll and default touch handling */
      #listaCanciones .cancion { touch-action: pan-y; }
      /* smooth movement animation for items when reordering */
      #listaCanciones .cancion {
        transition: transform 220ms cubic-bezier(.2,.9,.2,1), box-shadow 180ms ease, opacity 180ms ease;
        will-change: transform;
      }
      .placeholder {
        height: 140px; /* matches thumbnail height roughly */
        border-radius: 10px;
        background: rgba(255,255,255,0.02);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
        margin: 8px;
        transition: height 180ms ease, opacity 180ms ease;
      }
      .reorder-mode .cancion.dragging { opacity: 0.5; transform: scale(0.98); }
      @keyframes jiggle {
        0% { transform: rotate(-1.5deg); }
        50% { transform: rotate(1.5deg); }
        100% { transform: rotate(-1.5deg); }
      }

      /* Done button for reorder mode (above title) */
      #reorderDone {
        position: absolute; top: -58px; left: 50%; transform: translateX(-50%) scale(0.86); z-index: 1200; display:none;
        background: #1db954; color:black; padding:12px 18px; border-radius:14px; border:none; cursor:pointer; font-weight:800;
        font-size: 16px; box-shadow: 0 12px 30px rgba(29,185,84,0.18), 0 6px 14px rgba(0,0,0,0.35);
        transition: transform 360ms cubic-bezier(.2,.9,.2,1), opacity 260ms ease;
        opacity: 0;
      }
      #reorderDone.show {
        display: inline-block;
        transform: translateX(-50%) scale(1);
        opacity: 1;
      }
      #reorderDone.pop {
        animation: popIn 420ms cubic-bezier(.2,.9,.2,1);
      }
      @keyframes popIn {
        0% { transform: translateX(-50%) scale(0.7); opacity: 0; }
        60% { transform: translateX(-50%) scale(1.06); opacity: 1; }
        100% { transform: translateX(-50%) scale(1); opacity: 1; }
      }

      /* botón eliminar: solo visible en reorder mode */
      /* Target any button inside .cancion (not only direct child) so
        buttons nested in wrappers remain hidden until reorder-mode */
      #listaCanciones .cancion button {
        position: absolute;
        top: 6px;
        left: 6px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: none;
        background: white;
        color: black;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        opacity: 0;
        transform: scale(0.7);
        pointer-events: none;
        transition: opacity 180ms ease, transform 180ms ease;
      }

      /* show remove buttons only when in reorder-mode */
      .reorder-mode #listaCanciones .cancion button {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }

      /* Input mini menú */
      #buscarCancionMini {
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 16px;
        border-radius: 10px;
        border: none;
        font-size: 18px;
        background: #0f0f0f;
        color: #fff;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
      }

      /* Responsive: mobile adjustments */
      @media (max-width: 600px) {
        #miniCanciones {
          width: 96%;
          max-width: 96%;
          top: 70px;
          padding: 12px;
          max-height: 70vh;
        }
        #listaMiniCanciones {
          grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
          gap: 10px;
        }
        #listaMiniCanciones .cancion img {
          width: 88px;
          height: 88px;
        }
        #listaMiniCanciones .cancion p {
          font-size: 13px;
        }
        #buscarCancionMini { font-size: 14px; padding: 10px; }
      }

      @media (min-width: 900px) {
        /* Desktop: más impacto visual */
        #miniCanciones {
          padding: 22px;
          max-height: 82vh;
        }
        #listaMiniCanciones {
          grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
          gap: 18px;
        }
        #listaMiniCanciones .cancion img { width: 140px; height: 140px; }
        #listaMiniCanciones .cancion p { font-size: 16px; }
      }

      div {
        color: white;
      }

      /* Contenedor principal centrado y con ancho máximo para mejor lectura */
      #playlistContainer {
        position: relative;
        max-width: 1180px;
        margin: 8px auto 72px auto;
        padding: 12px;
        box-sizing: border-box;
      }

      /* shuffle circular */
#btnShuffle {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  border: none;
  margin-left: 47%;
  background: #2a2a2a;
  color: white;
  font-size: 22px;
  cursor: pointer;
  transition: all 0.2s ease;
}

/* estado activo */
#btnShuffle.activo {
  background: #1db954;
  color: black;
  transform: scale(1.08);
}

/* feedback táctil */
#btnShuffle:active{
  transform: scale(0.96);
}

    </style>
  </head>
  <body class="main">
    <div id="playlistContainer">
    <div class="volver" id="btn-volver">←</div>

    <div class="header-playlist">
      <h1 id="tituloPlaylist"></h1>
      <div style="display:flex;gap:10px;align-items:center;">
        <button id="reorderDone">Listo</button>
      </div>
      <div class="menu-opciones">
        ⋮
        <div class="miniMenuOpciones">
          <button id="renombrar">Renombrar Playlist</button>
          <button id="vaciar">Vaciar Playlist</button>
          <button id="borrar">Borrar Playlist</button>
          <button id="btnReordenar" title="Reordenar">Reordenar</button>
        </div>
      </div>
    </div>

    <div class="controls-bar">
      <button id="btnAgregarCancion">+ Agregar canción</button>
      <button id="btnShuffle">🔀</button>
    </div>

    <div id="miniCanciones">
      <input
        type="text"
        id="buscarCancionMini"
        placeholder="Buscar canción..."
      />
      <div id="listaMiniCanciones"></div>
    </div>

    <div id="menuBackdrop" aria-hidden="true"></div>

    <div id="listaCanciones"></div>

    <div id="notificacion"></div>
    </div>

    <!-- Catálogo local para agregar canciones (tu fuente local) -->
    <script src="canciones.js"></script>

    <!-- API -->
    <script src="api.js"></script>

    <script>
      const params = new URLSearchParams(location.search);
      const pid = params.get("id"); // id playlist por URL
      const tituloEl = document.getElementById("tituloPlaylist");
      const listaEl = document.getElementById("listaCanciones");
      const noti = document.getElementById("notificacion");
      let currentIndex = 0;
      let nextIndex = 0;
      let _shuffle = false; // estado local para compatibilidad



      let estado = {
        playlist: null, // {id,nombre,created_at}
        canciones: [], // [{id,titulo,artista,ruta,duration,orden}]
        shuffle: false, // estado shuffle ON/OFF
        ordenShuffle: [] // orden actual de canciones para shuffle (array de índices)
      };

      // ======= Helpers UI =======
      function toast(texto) {
        noti.textContent = texto;
        noti.style.opacity = "1";
        setTimeout(() => (noti.style.opacity = "0"), 1800);
      }

      // Reorder mode controls
      const reorderDone = document.getElementById('reorderDone');
      function enableReorderMode() {
        document.body.classList.add('reorder-mode');
        listaEl.classList.add('reorder-mode');
        // show button with animation
        reorderDone.classList.remove('pop');
        reorderDone.classList.add('show');
        // force reflow then pop
        void reorderDone.offsetWidth;
        reorderDone.classList.add('pop');
        // make items draggable and disable native touch actions while reordering
        listaEl.querySelectorAll('.cancion').forEach(n => { n.draggable = true; try { n.style.touchAction = 'none'; } catch(e){} });
      }
      async function disableReorderMode() {
        document.body.classList.remove('reorder-mode');
        listaEl.classList.remove('reorder-mode');
        // hide animated
        reorderDone.classList.remove('pop');
        reorderDone.classList.remove('show');
        listaEl.querySelectorAll('.cancion').forEach(n => { n.draggable = false; try { n.style.touchAction = ''; } catch(e){} });
        // persist order to server
        try {
          const nodes = Array.from(listaEl.querySelectorAll('.cancion'));
          const newOrder = nodes.map(n => Number(n.dataset.songId));
          // call API to persist
          const res = await api.reorderPl(pid, newOrder);
          if (res && res.ok) {
            toast('Orden guardado en el servidor');
            // reload to sync orden and show updated order
            await cargar();
          } else {
            toast('No se pudo guardar el orden en el servidor');
          }
        } catch (err) {
          console.error('persist reorder', err);
          toast('Error al guardar el orden');
        }
      }
      reorderDone.addEventListener('click', () => { disableReorderMode(); });
      // visible toggle to enter reorder mode (useful on desktop)
      const btnReordenar = document.getElementById('btnReordenar');
      if (btnReordenar) {
        btnReordenar.addEventListener('click', () => {
          if (document.body.classList.contains('reorder-mode')) disableReorderMode();
          else enableReorderMode();
        });
      }

      // Evitar el menú contextual del navegador mientras estemos en reorder-mode
      document.addEventListener('contextmenu', (e) => {
        if (document.body.classList.contains('reorder-mode')) {
          e.preventDefault();
        }
      });

      // Devuelve el índice de la próxima canción sin alterar la actual
      function actualizarProximaCancion() {
        const n = estado.canciones.length;
        if (!n) return;

        // Usar el índice real del reproductor
        const realIndex = playlistActualIndex();

        if (_shuffle) {
          let rnd;
          do {
            rnd = Math.floor(Math.random() * n);
          } while (rnd === realIndex && n > 1);
          nextIndex = rnd;
        } else {
          nextIndex = (realIndex + 1) % n;
        }
      }









      // Reproducir canción en el reproductor (frame inferior)
      function reproducir(index, preservarActual = false) {
  if (!estado.canciones?.length) return;

  if (!preservarActual) {
    currentIndex = index; // ⚡ Actualizamos currentIndex
    actualizarProximaCancion();
  }

  const payload = {
    playlist: estado.canciones.map((c) => ({
      titulo: c.titulo,
      artista: c.artista,
      ruta: c.ruta,
      thumbnail: c.thumbnail || "",
    })),
    index: currentIndex,
    shuffle: estado.shuffle,
    ordenShuffle: estado.ordenShuffle
    ,
    name: estado.playlist?.nombre || ''
  };

  if (parent?.frames?.reproductorFrame) {
    parent.frames["reproductorFrame"].postMessage(payload, "*");
  }
}






      // Generar orden aleatorio de índices para shuffle
      function generarShuffleIndices(length) {
        const arr = Array.from({ length }, (_, i) => i);
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }



      // Render canciones
      function renderCanciones() {
        // remove any leftover placeholders (from aborted drags) before rendering
        Array.from(document.querySelectorAll('.placeholder')).forEach(n => n.remove());
        listaEl.innerHTML = "";
        if (!estado.canciones.length) {
          listaEl.innerHTML = "<p>No hay canciones en esta playlist.</p>";
          return;
        }
        estado.canciones.forEach((c, i) => {
          const row = document.createElement("div");
          row.className = "cancion";
            row.draggable = false;
            row.dataset.songId = c.id;

          const img = document.createElement("img");
          img.alt = c.titulo || "canción";
          img.src = c.thumbnail;

          const title = document.createElement("p");
          title.textContent = c.titulo || "(sin título)";
          title.style.margin = "0";
          title.style.fontSize = "16px";

          // Botón eliminar
          const btnDel = document.createElement("button");
          btnDel.textContent = "−";
          Object.assign(btnDel.style, {
            position: "absolute",
            top: "0",
            left: "0",
            width: "25px",
            height: "25px",
            borderRadius: "50%",
            border: "none",
            background: "white",
            color: "black",
            fontWeight: "bold",
            cursor: "pointer",
          });

          btnDel.addEventListener("click", async (e) => {
            e.stopPropagation();
            try {
              await api.delSong(pid, c.id);
              await cargar();
              toast(`Se eliminó "${c.titulo || ""}"`);
              if (parent?.frames?.bibliotecaFrame) {
                parent.frames["bibliotecaFrame"].location.href =
                  "biblioteca.html?refresh=" + Date.now();
              }
            } catch (err) {
              alert(err?.error || "Error al eliminar");
            }
          });

          const contImg = document.createElement("div");
          contImg.appendChild(img);
          contImg.appendChild(btnDel);

          row.appendChild(contImg);
          row.appendChild(title);
          // click to play (disabled while in reorder mode)
          row.addEventListener("click", () => { if (!document.body.classList.contains('reorder-mode')) reproducir(i); });

          // long-press to enable reorder/jiggle mode
          let lpTimer = null;
          const startLP = (ev) => {
            if (document.body.classList.contains('reorder-mode')) return;
            lpTimer = setTimeout(() => {
              enableReorderMode();
              // make the element draggable after entering mode
              row.draggable = true;
            }, 480);
          };
          const cancelLP = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };
          row.addEventListener('mousedown', startLP);
          row.addEventListener('touchstart', startLP);
          row.addEventListener('mouseup', cancelLP);
          row.addEventListener('mouseleave', cancelLP);
          row.addEventListener('touchend', cancelLP);

          // Pointer-based drag (works for mouse and touch) - smooth ghost + placeholder
          row.addEventListener('pointerdown', (ev) => {
            if (!document.body.classList.contains('reorder-mode')) return;
            if (ev.button && ev.button !== 0) return; // only primary
            ev.preventDefault();

            const orig = row;
            const rect = orig.getBoundingClientRect();
            const placeholder = document.createElement('div');
            placeholder.className = 'placeholder';
            placeholder.style.width = rect.width + 'px';
            placeholder.style.height = rect.height + 'px';

            // insert placeholder in place of original
            orig.parentNode.insertBefore(placeholder, orig);
            orig.style.visibility = 'hidden';

            // try to capture pointer so we reliably get pointerup/pointercancel
            try { if (orig.setPointerCapture) orig.setPointerCapture(ev.pointerId); } catch(e){}

            // create ghost clone
            const ghost = orig.cloneNode(true);
            ghost.style.position = 'fixed';
            ghost.style.left = rect.left + 'px';
            ghost.style.top = rect.top + 'px';
            ghost.style.width = rect.width + 'px';
            ghost.style.pointerEvents = 'none';
            ghost.style.zIndex = 20000;
            ghost.style.boxShadow = '0 20px 40px rgba(0,0,0,0.45)';
            ghost.style.transform = 'scale(1.04)';
            document.body.appendChild(ghost);

            const onMove = (mev) => {
              const x = mev.clientX;
              const y = mev.clientY;
              ghost.style.left = x - rect.width / 2 + 'px';
              ghost.style.top = y - rect.height / 2 + 'px';

              // Adjust placeholder position dynamically
              const over = document.elementFromPoint(x, y);
              if (over && over !== placeholder && over.classList.contains('cancion')) {
                const parent = over.parentNode;
                if (parent) {
                  const rectOver = over.getBoundingClientRect();
                  const before = y < rectOver.top + rectOver.height / 2;
                  parent.insertBefore(placeholder, before ? over : over.nextSibling);
                }
              }
            };

            const onUp = () => {
              // Remove ghost and placeholder
              ghost.remove();
              placeholder.remove();
              orig.style.visibility = '';

              // Update song order
              const nodes = Array.from(listaEl.querySelectorAll('.cancion'));
              estado.canciones = nodes.map((n) => estado.canciones.find((s) => String(s.id) === String(n.dataset.songId))).filter(Boolean);

              // Persist order to server
              api.reorderPl(pid, estado.canciones.map((c) => c.id));

              // Cleanup event listeners
              window.removeEventListener('pointermove', onMove);
              window.removeEventListener('pointerup', onUp);
              window.removeEventListener('pointercancel', onUp);
            };

            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onUp);
            window.addEventListener('pointercancel', onUp);
          });
          listaEl.appendChild(row);
        });
      }

      // ======= Carga inicial =======
      (async function init() {
        const ok = await requireAuth();
        if (!ok) return;
        if (!pid) {
          location.href = "contenido.html";
          return;
        }
        await cargar();
      })();

      async function cargar() {
        try {
          const r = await api.getPl(pid); // { playlist, canciones }
          estado.playlist = r.playlist;
          estado.canciones = r.canciones || [];

          // Reparar thumbnails
          estado.canciones = estado.canciones.map((c) => {
            if (!c.thumbnail) {
              const match = cancionesCatalogo.find(
                (x) => x.ruta === c.ruta || x.titulo === c.titulo
              );
              if (match) c.thumbnail = match.thumbnail;
            }
            return c;
          });

          // Mantener estado de shuffle previo; si está activo y no hay orden, generarla
          if (estado.shuffle) {
            if (!Array.isArray(estado.ordenShuffle) || estado.ordenShuffle.length !== estado.canciones.length) {
              estado.ordenShuffle = generarShuffleIndices(estado.canciones.length);
            }
            btnShuffle.classList.add("activo");
          } else {
            estado.ordenShuffle = estado.ordenShuffle || [];
            btnShuffle.classList.remove("activo");
          }


          tituloEl.textContent = estado.playlist?.nombre || "Playlist";
          renderCanciones();
        } catch (e) {
          alert(e?.error || "Error al cargar la playlist");
          location.href = "contenido.html";
        }
      }


      // ======= Volver =======
      document.getElementById("btn-volver").addEventListener("click", () => {
        if (parent?.frames?.contenidoFrame) {
          parent.frames["contenidoFrame"].location.href = "contenido.html";
        } else {
          location.href = "contenido.html";
        }
      });

      // ======= Menú opciones =======
      const menuOpciones = document.querySelector(".menu-opciones");
      const miniMenuOpciones = document.querySelector(".miniMenuOpciones");
      menuOpciones.addEventListener("click", () => {
        miniMenuOpciones.style.display =
          miniMenuOpciones.style.display === "flex" ? "none" : "flex";
        miniMenuOpciones.style.flexDirection = "column";
      });

      // === REEMPLAZADO: Renombrar (usa api.renamePl) ===
      document
        .getElementById("renombrar")
        .addEventListener("click", async () => {
          const actual = (estado.playlist?.nombre || "").trim();
          const nuevoNombre = prompt("Nuevo nombre para la playlist:", actual);
          if (!nuevoNombre) return;
          const nombre = nuevoNombre.trim();
          if (!nombre || nombre === actual) return;

          try {
            await api.renamePl(pid, nombre);
            await cargar(); // recarga el nombre en la vista
            if (parent?.frames?.bibliotecaFrame) {
              parent.frames["bibliotecaFrame"].location.href =
                "biblioteca.html?refresh=" + Date.now();
            }
            toast("Playlist renombrada");
          } catch (e) {
            alert(e?.error || "Error al renombrar");
          }
        });


      // ======= Shuffle ON/OFF =======
      const btnShuffle = document.getElementById("btnShuffle");

      function playlistActualIndex() {
        if (!parent?.frames?.reproductorFrame) return 0;
        const rep = parent.frames["reproductorFrame"]._debugPlayer;
        if (!rep || !rep.currentPlaylist) return 0;

        const actualRuta = rep.currentPlaylist[rep.currentIndex]?.ruta;
        return estado.canciones.findIndex(c => c.ruta === actualRuta) || 0;
      }


      btnShuffle.addEventListener("click", () => {
        estado.shuffle = !estado.shuffle;
        _shuffle = estado.shuffle;

        // Generar o limpiar ordenShuffle según estado
        if (estado.shuffle) {
          estado.ordenShuffle = generarShuffleIndices(estado.canciones.length);
        } else {
          estado.ordenShuffle = [];
        }

        btnShuffle.classList.toggle("activo", estado.shuffle);
        toast(estado.shuffle ? "Shuffle activado" : "Shuffle desactivado");

        // Obtener el índice real del reproductor
        const realIndex = playlistActualIndex();

        const payload = {
          playlist: estado.canciones.map((c) => ({
            titulo: c.titulo,
            artista: c.artista,
            ruta: c.ruta,
            thumbnail: c.thumbnail || "",
          })),
          index: realIndex,
          shuffle: estado.shuffle,
          ordenShuffle: estado.ordenShuffle
        };
        if (parent?.frames?.reproductorFrame) {
          parent.frames["reproductorFrame"].postMessage(payload, "*");
        }
        // recalcular próxima canción localmente usando el índice real
        actualizarProximaCancion();
      });












      // === REEMPLAZADO: Vaciar (usa api.clearPl) ===
      document.getElementById("vaciar").addEventListener("click", async () => {
        if (!estado.canciones.length) return;
        if (!confirm("¿Vaciar la playlist?")) return;
        try {
          await api.clearPl(pid); // DELETE /api/playlists/:id/songs
          await cargar();
          toast("Playlist vaciada");
          if (parent?.frames?.bibliotecaFrame) {
            parent.frames["bibliotecaFrame"].location.href =
              "biblioteca.html?refresh=" + Date.now();
          }
        } catch (e) {
          alert(e?.error || "Error al vaciar");
        }
      });

      // Borrar playlist completa (ya estaba OK)
      document.getElementById("borrar").addEventListener("click", async () => {
        if (!confirm("¿Estás seguro de borrar esta playlist?")) return;
        try {
          await api.delPl(pid);
          if (parent?.frames?.bibliotecaFrame) {
            parent.frames["bibliotecaFrame"].location.href =
              "biblioteca.html?refresh=" + Date.now();
          }
          if (parent?.frames?.contenidoFrame) {
            parent.frames["contenidoFrame"].location.href = "contenido.html";
          } else {
            location.href = "contenido.html";
          }
        } catch (e) {
          alert(e?.error || "Error al borrar playlist");
        }
      });

      // ======= Mini menú agregar canción (usa canciones.js local) =======
      const btnAgregar = document.getElementById("btnAgregarCancion");
      const miniCanciones = document.getElementById("miniCanciones");
      const listaMini = document.getElementById("listaMiniCanciones");
      const inputBuscarMini = document.getElementById("buscarCancionMini");

      let _miniOpen = false;
      let _escHandler = null;
      const menuBackdrop = document.getElementById('menuBackdrop');

      function openMini() {
        // show (request parent to render global overlay)
        _miniOpen = true;
        inputBuscarMini.value = "";
        mostrarMiniCanciones("");
        inputBuscarMini.focus();
        listaMini.scrollTop = 0;

        // build HTML for parent overlay using current listaMini content
        const wrapper = document.createElement('div');
        wrapper.style.boxSizing = 'border-box';
        wrapper.style.width = '50%';
        wrapper.style.minWidth = '360px';
        wrapper.style.maxWidth = '1280px';
        wrapper.style.maxHeight = '80vh';
        wrapper.style.overflow = 'auto';
        wrapper.style.padding = '22px';
        wrapper.style.margin = '0 auto';
        wrapper.style.background = 'rgba(15,15,15,0.98)';
        wrapper.style.borderRadius = '12px';
        wrapper.style.boxShadow = '0 22px 50px rgba(0,0,0,0.65)';
        // Provide a search input and an empty results container for the parent overlay.
        wrapper.innerHTML = `<input type="text" id="__overlayBuscar" placeholder="Buscar canción..." style="width:100%;padding:14px 16px;border-radius:10px;border:none;font-size:18px;background:#0f0f0f;color:#fff;margin-bottom:16px;">
          <div id="__overlayResults"></div>`;

        // helper to build HTML grid for a query (used when parent asks for results)
        const buildResultsHtml = (query) => {
          const q = (query || '').toString().trim().toLowerCase();
          const items = q === '' ? cancionesCatalogo.slice() : cancionesCatalogo.filter((c) => (c.titulo || '').toLowerCase().includes(q));
          if (!items.length) return '<div style="color:#999;padding:18px">No se encontraron canciones.</div>';
          const grid = document.createElement('div');
          grid.style.display = 'grid';
          grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(220px, 1fr))';
          grid.style.gap = '22px 24px';
          items.forEach(c => {
            const safeTitle = (c.titulo || '').replace(/</g,'&lt;').replace(/\"/g,'');
            const safeRuta = (c.ruta || '').replace(/\"/g,'');
            const thumb = c.thumbnail || '';
            const html = `<div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 8px;cursor:pointer;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);">
              <img src="${thumb}" alt="${safeTitle}" style="width:140px;height:140px;border-radius:10px;object-fit:cover;" />
              <p style="color:#fff;text-align:center;margin:0">${safeTitle}</p>
              <button data-mini-action="add" data-ruta="${safeRuta}" data-titulo="${safeTitle}" style="margin-top:8px;padding:6px 10px;border-radius:6px;">Agregar</button>
            </div>`;
            const div = document.createElement('div'); div.innerHTML = html; grid.appendChild(div.firstElementChild);
          });
          return grid.outerHTML;
        };

        // Listen for parent overlay search requests and reply with HTML results
        const _overlayHandler = (ev) => {
          const d = ev.data || {};
          if (!d || d.type !== 'overlay-search') return;
          // reply to parent with rendered HTML for results
          try { ev.source.postMessage({ type: 'overlay-html', html: buildResultsHtml(d.query || '') }, '*'); } catch (err) { /* ignore */ }
        };
        window.addEventListener('message', _overlayHandler, { once: false });

        // send to parent
        try { parent.postMessage({ type: 'show-mini-menu', html: wrapper.outerHTML }, '*'); } catch (err) { console.warn('No parent to show overlay', err); }

        // ESC key (use window listener to close via parent)
        _escHandler = (ev) => { if (ev.key === 'Escape' || ev.key === 'Esc') closeMini(); };
        window.addEventListener('keydown', _escHandler, { capture: true });
      }

      function closeMini() {
        // request parent to hide overlay
        try { parent.postMessage({ type: 'hide-mini-menu' }, '*'); } catch (err) { /* ignore */ }
        _miniOpen = false;
        if (_escHandler) { window.removeEventListener('keydown', _escHandler, { capture: true }); _escHandler = null; }
      }

      btnAgregar.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (!_miniOpen) openMini(); else closeMini();
      });

      // Listen for clicks from parent overlay (when user clicks "Agregar")
      window.addEventListener('message', async (ev) => {
        const d = ev.data || {};
        if (d && d.type === 'mini-menu-click') {
          // find item in catalog by ruta or titulo
          const item = cancionesCatalogo.find(x => (x.ruta || '') === (d.ruta || '') || (x.titulo || '') === (d.titulo || ''));
          if (!item) return toast('Elemento no encontrado');
          try {
            const ya = estado.canciones.some((x) => (x.ruta||'') === (item.ruta||'') && (x.titulo||'') === (item.titulo||''));
            if (ya) { toast('Ya estaba en la playlist'); return; }
            await api.addSong(pid, { titulo: item.titulo, artista: item.artista||'', ruta: item.ruta||'', thumbnail: item.thumbnail||'', duration: item.duration||null });
            await cargar();
            toast('Canción agregada');
            // ask parent to hide overlay
            try { parent.postMessage({ type: 'hide-mini-menu' }, '*'); } catch (err) {}
          } catch (err) {
            alert(err?.error || 'Error al agregar canción');
          }
        }
      });

      inputBuscarMini.addEventListener("input", () => {
        mostrarMiniCanciones(inputBuscarMini.value);
      });

      function mostrarMiniCanciones(query = "") {
        const q = (query || "").toString().trim().toLowerCase();
        listaMini.innerHTML = "";

        // Ensure cancionesCatalogo is defined and not empty
        if (!Array.isArray(cancionesCatalogo) || cancionesCatalogo.length === 0) {
          const noCatalog = document.createElement("div");
          noCatalog.style.color = "#999";
          noCatalog.style.padding = "18px";
          noCatalog.textContent = "El catálogo de canciones no está disponible.";
          listaMini.appendChild(noCatalog);
          return;
        }

        // Si la búsqueda está vacía, mostrar todo el catálogo
        const items = q === ""
          ? cancionesCatalogo.slice() // copia del array
          : cancionesCatalogo.filter((c) => (c.titulo || "").toLowerCase().includes(q));

        // Si no hubo resultados, mostrar mensaje
        if (!items.length) {
          const no = document.createElement("div");
          no.style.color = "#999";
          no.style.padding = "18px";
          no.textContent = "No se encontraron canciones.";
          listaMini.appendChild(no);
          return;
        }

        items.forEach((c) => {
          const div = document.createElement("div");
          div.classList.add("cancion");
          div.innerHTML = `<img src="${c.thumbnail}" alt="${c.titulo}"><p>${c.titulo}</p>`;
          div.addEventListener("click", async () => {
            try {
              // Evitar duplicados por título+ruta
              const ya = estado.canciones.some(
                (x) => (x.ruta || "") === (c.ruta || "") && (x.titulo || "") === (c.titulo || "")
              );
              if (ya) return toast("Ya estaba en la playlist");

              await api.addSong(pid, {
                titulo: c.titulo,
                artista: c.artista || "",
                ruta: c.ruta || "",
                thumbnail: c.thumbnail || "",
                duration: c.duration || null,
              });
              await cargar();
              toast(`Se agregó "${c.titulo}"`);
              if (parent?.frames?.bibliotecaFrame) {
                parent.frames["bibliotecaFrame"].location.href =
                  "biblioteca.html?refresh=" + Date.now();
              }
            } catch (e) {
              alert(e?.error || "Error al agregar canción");
            }
          });
          listaMini.appendChild(div);
        });
      }
    </script>
  </body>
</html>
