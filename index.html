<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/174/174872.png">
  <title>Mini Spotify</title>
  <script src="api.js"></script>
  <script>
  async function boot() {
    const t = getToken();
    if (!t) { top.location.replace('login.html'); return; }
    try {
      await api.me(); // sesión válida
    } catch {
      // apiFetch limpia el token y como NO estamos en login, nos manda a login
    }
  }
  
  </script>
</head>
<script>
  // este listener recibe el mensaje de reproductor.html y ajusta rows del frameset
  window.addEventListener('message', (e) => {
    if (!e.data || !e.data.setPlayerHeight) return;
    const h = Number(e.data.setPlayerHeight) || 120;
    try {
      const fs = document.getElementsByTagName('frameset')[0];
      if (!fs) return;
      // ajusta la última fila a px (10%,*,<px>)
      // conservá las dos primeras como estaban (siempre: 10% y *), pero reemplaza la última
      // si querés otra lógica, la adaptamos
      fs.rows = `10%,*,${Math.max(100, h)}px`;
    } catch (err) {
      console.warn('No se pudo ajustar frameset rows', err);
    }
  }, false);
</script>


<!-- OJO: en documentos con frames, no se usa <body>; va <frameset> -->
<!-- Global overlay/backdrop (created by script below) -->
<script>
// Crea un backdrop y un contenedor de overlay en el documento padre
(function(){
  function qs(id){return document.getElementById(id);} 
  const styleBase = 'position:fixed;inset:0;display:none;';
  const backdrop = document.createElement('div');
  backdrop.id = 'globalBackdrop';
  backdrop.setAttribute('style', styleBase + 'background:rgba(0,0,0,0.45);z-index:9990;');
  document.documentElement.appendChild(backdrop);

  const overlay = document.createElement('div');
  overlay.id = 'globalOverlay';
  // start hidden (display:none). When showing, we'll set display:flex so centering works.
  overlay.setAttribute('style', styleBase + 'z-index:10000;align-items:center;justify-content:center;overflow:auto;pointer-events:none;');
  document.documentElement.appendChild(overlay);

  let _currentBubble = null;
  let _pendingCreateFrom = null;

  function hideOverlay(){
    backdrop.style.display='none';
    overlay.style.pointerEvents='none';
    overlay.style.display='none';
    overlay.innerHTML='';
    backdrop.removeEventListener('click', hideOverlay);
    // remove bubble if any
    try { if (_currentBubble) { _currentBubble.remove(); _currentBubble = null; } } catch(e){}
    _pendingCreateFrom = null;
  }

  // close when clicking outside the menu wrapper (on the overlay background)
  overlay.addEventListener('click', function(ev){ if (ev.target === overlay) hideOverlay(); });

  window.addEventListener('message', (ev) => {
    const d = ev.data || {};
    if (d.type === 'show-mini-menu') {
      // d.html should contain the menu markup; parent will render it
      overlay.innerHTML = d.html || '';
      backdrop.style.display = 'block';
      // make overlay visible and center its contents
      overlay.style.display = 'flex';
      overlay.style.pointerEvents = 'auto';

      // wire up add buttons inside the overlay: send click back to contenidoFrame
      overlay.querySelectorAll('[data-mini-action="add"]').forEach(el => {
        el.addEventListener('click', () => {
          const payload = { type: 'mini-menu-click', ruta: el.dataset.ruta, titulo: el.dataset.titulo };
          try { window.frames['contenidoFrame'].postMessage(payload, '*'); } catch (err) { /* ignore */ }
        });
      });

      backdrop.addEventListener('click', hideOverlay);
    } else if (d.type === 'open-create-playlist') {
      // open create-playlist modal rendered by parent, with bubble animation from child button
      const btnRect = d.btnRect || { left: 0, top: 0, width: 0, height: 0 };
      // find the frame element corresponding to the source window
      const frames = Array.from(document.getElementsByTagName('frame'));
      const srcWin = ev.source;
      let frameEl = null;
      for (const f of frames) {
        try { if (f.contentWindow === srcWin) { frameEl = f; break; } } catch(e){}
      }

      // compute absolute coords
      let absX = window.innerWidth/2, absY = window.innerHeight/2;
      if (frameEl) {
        const fr = frameEl.getBoundingClientRect();
        absX = fr.left + btnRect.left + (btnRect.width||0)/2;
        absY = fr.top + btnRect.top + (btnRect.height||0)/2;
      }

      // create bubble
      const bubble = document.createElement('div');
      _currentBubble = bubble;
      Object.assign(bubble.style, {
        position: 'fixed', left: absX + 'px', top: absY + 'px', width: '24px', height: '24px',
        borderRadius: '50%', pointerEvents: 'none', zIndex: 9995,
        transform: 'translate(-50%,-50%) scale(0)', transition: 'all 420ms cubic-bezier(.2,.9,.2,1), opacity 280ms ease',
        background: 'radial-gradient(circle at 30% 30%, rgba(29,185,84,0.98), rgba(20,140,60,0.95))', boxShadow: '0 10px 40px rgba(0,0,0,0.45)'
      });
      document.documentElement.appendChild(bubble);

      // expand to center and large size
      const maxDim = Math.max(window.innerWidth, window.innerHeight) * 2;
      requestAnimationFrame(() => {
        bubble.style.left = (window.innerWidth/2) + 'px';
        bubble.style.top = (window.innerHeight/2) + 'px';
        bubble.style.width = maxDim + 'px';
        bubble.style.height = maxDim + 'px';
        bubble.style.transform = 'translate(-50%,-50%) scale(1)';
      });

      const doneShow = () => {
        // render modal HTML inside overlay (include simple styles)
        overlay.innerHTML = `
          <style>
            .gp-modal { width:100%; max-width:720px; background:linear-gradient(180deg,#0f0f0f,#121212); border-radius:14px; padding:20px; color:#fff; box-shadow:0 18px 40px rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.04); text-align:center; }
            .gp-modal h3{ margin:0 0 8px 0; }
            .gp-modal .sub{ color:#bdbdbd; margin-bottom:12px; }
            .gp-input{ width:100%; padding:12px 14px; border-radius:10px; background:#151515; color:#fff; border:1px solid rgba(255,255,255,0.06); margin-bottom:12px; }
            .gp-actions{ display:flex; gap:10px; justify-content:center; }
            .gp-primary{ background:linear-gradient(180deg,#1db954,#15a84a); color:black; font-weight:700; border:none; padding:10px 16px; border-radius:10px; cursor:pointer; }
            .gp-secondary{ background:transparent; color:#ddd; border:1px solid rgba(255,255,255,0.06); padding:10px 16px; border-radius:10px; cursor:pointer; }
            @media(max-width:420px){ .gp-modal{ max-width:92%; padding:16px; border-radius:12px; } }
          </style>
          <div class="gp-modal" role="dialog" aria-modal="true">
            <h3>Crear nueva playlist</h3>
            <div class="sub">Elegí un nombre para tu playlist</div>
            <input id="global_nombrePlaylist" class="gp-input" placeholder="Nombre de la playlist..." />
            <div class="gp-actions"><button id="global_create_btn" class="gp-primary">Crear</button><button id="global_cancel_btn" class="gp-secondary">Cancelar</button></div>
          </div>`;

        backdrop.style.display = 'block';
        overlay.style.display = 'flex';
        overlay.style.pointerEvents = 'auto';
        backdrop.addEventListener('click', hideOverlay);

        // fade bubble out a bit
        bubble.style.opacity = '0.95';

        // wire buttons
        const createBtn = overlay.querySelector('#global_create_btn');
        const cancelBtn = overlay.querySelector('#global_cancel_btn');
        const input = overlay.querySelector('#global_nombrePlaylist');
        input.focus();

        _pendingCreateFrom = srcWin;

        createBtn.addEventListener('click', () => {
          const name = (input.value || '').trim();
          if (!name) return alert('Poné un nombre');
          try { srcWin.postMessage({ type: 'create-playlist', name }, '*'); } catch (err) { alert('No se puede crear (error interno)'); }
        });
        cancelBtn.addEventListener('click', hideOverlay);
      };

      bubble.addEventListener('transitionend', function onend(ev2){
        if (ev2.propertyName === 'width' || ev2.propertyName === 'transform') {
          bubble.removeEventListener('transitionend', onend);
          // small delay for smoothness
          setTimeout(doneShow, 80);
        }
      });

      // safety fallback
      setTimeout(doneShow, 520);
    } else if (d.type === 'hide-mini-menu') {
      hideOverlay();
    } else if (d.type === 'open-playlist-context') {
      // d: { id, name, x, y }
      const btnRect = { left: d.x || 0, top: d.y || 0, width: 0, height: 0 };
      const frames = Array.from(document.getElementsByTagName('frame'));
      const srcWin = ev.source;
      let frameEl = null;
      for (const f of frames) {
        try { if (f.contentWindow === srcWin) { frameEl = f; break; } } catch(e){}
      }
      let absX = window.innerWidth/2, absY = window.innerHeight/2;
      if (frameEl) {
        const fr = frameEl.getBoundingClientRect();
        absX = fr.left + (d.x || 0);
        absY = fr.top + (d.y || 0);
      }
      // render a small context menu at absX, absY inside overlay
      overlay.innerHTML = '';
      const menu = document.createElement('div');
      menu.style.position = 'fixed';
      menu.style.left = absX + 'px';
      menu.style.top = absY + 'px';
      menu.style.transform = 'translate(-6px,-6px)';
      menu.style.background = '#1b1b1b';
      menu.style.border = '1px solid rgba(255,255,255,0.04)';
      menu.style.color = '#fff';
      menu.style.borderRadius = '8px';
      menu.style.padding = '6px';
      menu.style.boxShadow = '0 12px 30px rgba(0,0,0,0.6)';
      menu.style.zIndex = 10001;
      menu.innerHTML = `
        <div style="display:flex;flex-direction:column;min-width:160px;">
          <button data-action="rename" style="padding:8px;border:none;background:transparent;color:#fff;text-align:left;cursor:pointer;">Renombrar</button>
          <button data-action="empty" style="padding:8px;border:none;background:transparent;color:#fff;text-align:left;cursor:pointer;">Vaciar</button>
          <button data-action="delete" style="padding:8px;border:none;background:transparent;color:#ff5b5b;text-align:left;cursor:pointer;">Eliminar</button>
        </div>`;
      overlay.appendChild(menu);
      backdrop.style.display = 'block';
      overlay.style.display = 'block';
      overlay.style.pointerEvents = 'auto';

      // wire actions
      menu.querySelectorAll('button').forEach(bt => {
        bt.addEventListener('click', (evb) => {
          const action = bt.dataset.action || bt.getAttribute('data-action');
          // send action back to source frame
          try {
            srcWin.postMessage({ type: 'playlist-action', action, id: d.id, name: d.name || '' }, '*');
          } catch(e){}
          // close overlay
          backdrop.style.display = 'none'; overlay.style.display = 'none'; overlay.style.pointerEvents = 'none'; overlay.innerHTML = '';
        });
      });
      // clicking outside will close
      backdrop.addEventListener('click', () => { backdrop.style.display = 'none'; overlay.style.display = 'none'; overlay.style.pointerEvents = 'none'; overlay.innerHTML = ''; });
    } else if (d.type === 'create-playlist-result') {
      // child reports result of playlist creation
      // only react if it matches the pending frame
      if (!_pendingCreateFrom || ev.source !== _pendingCreateFrom) return;
      if (d.ok) {
        // close overlay and optionally show a brief success (could be improved)
        hideOverlay();
        try { alert('Playlist creada correctamente'); } catch(e){}
      } else {
        alert('Error: ' + (d.error || 'No se pudo crear la playlist'));
      }
    }
  }, false);
})();
</script>
<frameset rows="10%,*,80px" border="0" onload="boot()">
  <!-- Barra superior -->
  <frame src="barra.html" name="barraFrame" scrolling="no" noresize>

  <!-- Centro: Biblioteca + Contenido -->
  <frameset cols="20%,*" border="0">
    <frame src="biblioteca.html" name="bibliotecaFrame" scrolling="auto">
    <frame src="contenido.html"  name="contenidoFrame"  scrolling="auto">
  </frameset>

  <!-- Reproductor -->
  <frame src="reproductor.html" name="reproductorFrame" scrolling="no" noresize>
  <noframes>
    <p>Tu navegador no soporta frames. <a href="login.html">Ingresá aquí</a>.</p>
  </noframes>
</frameset>
</html>
