<!DOCTYPE html>

    <style>
      .btn-agregar {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 25px;
        height: 25px;
        border-radius: 50%;
        background-color: #1db954;
        color: black;
        font-weight: bold;
        border: none;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .miniPlaylists {
        position: absolute;
        background-color: #2a2a2a00;
        border-radius: 8px;
        padding: 5px;
        display: none;
        flex-direction: column;
        z-index: 100;
      }

      .miniPlaylists button {
        background: none;

        cursor: pointer;
        text-align: left;
      }

      .miniPlaylists button:hover {

        color: black;

      .cancion-wrapper {
        position: relative;
        display: inline-block;
        margin: 10px;
      }

      .cancion img {
        width: 120px;
        height: 120px;
        border-radius: 10px;
        object-fit: cover;
        display: block;
      }
      .cancion p { margin: 6px 0 0; font-size: 14px; color: #fff; text-align: center; }

      #notificacion {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #1db954;
        color: black;
        padding: 10px 20px;
        border-radius: 8px;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 999;
      }
      .seccion-lista {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 20px;
        padding: 10px 0;
      }

    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 10px;
  }

  .cancion {

    height: auto;
  }

}

/* ===== QUICK PLAYLISTS — estilo biblioteca ===== */

.qp-card {
  height: auto;
  border-radius: 8px;
  background: #0f0f0f;
  border: 1px solid #222;
  padding: 10px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  transition: all .15s ease;
}

.qp-card:hover {
  background: #0f0f0f;
  transform: translateX(2px);
}

.qp-title {
  color: #fff;
  font-weight: normal;
}

/* botón verde EXACTO de biblioteca */

.qp-create {
  background-color: #1db954;
  color: black;
  font-weight: bold;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.qp-title {
    background-color: transparent;
}

.qp-create .qp-title {
  color: black;
  font-weight: bold;
  width: 100%;          /* 👈 clave */

}

/* ===== GRID QUICK PLAYLISTS ===== */

#qpGrid {
  display: grid;
  grid-template-columns: repeat(2, 1fr); /* 2 columnas */
  grid-template-rows: repeat(3, auto);   /* hasta 3 filas */
  gap: 10px;
}

/* header quick playlists */

  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

#verMasPlaylists {
  color: #1db954;
  cursor: pointer;
  font-weight: bold;
  text-decoration: underline;
  font-size: 14px;
}

  margin-bottom: 20px;
}

  <body class="main">

    <!-- ===== Playlists rápidas ===== -->
    <section id="quickPlaylists">
      <div class="qp-header">
        <h2>Tus playlists</h2>
        <span id="verMasPlaylists">Ver más</span>
      </div>

      <div id="qpGrid"></div>
    </section>


    <h1>Explorar canciones</h1>

    <div id="contenedor-secciones"></div>

    <div id="notificacion"></div>

    <script src="canciones.js"></script>
    <script src="api.js"></script>
    <script>
      function mostrarNotificacion(texto) {
        const notificacion = document.getElementById("notificacion");
        notificacion.textContent = texto;
        notificacion.style.opacity = "1";
        setTimeout(() => (notificacion.style.opacity = "0"), 2000);
      }

      // crear una sección y llenarla
      function crearSeccion(nombre, canciones) {
        const contenedor = document.getElementById("contenedor-secciones");

        const h3 = document.createElement("h3");
        h3.textContent = nombre.charAt(0).toUpperCase() + nombre.slice(1);
        contenedor.appendChild(h3);

        const lista = document.createElement("div");
        lista.classList.add("seccion-lista"); // usamos estilos globales
        contenedor.appendChild(lista);

        generarCanciones(lista, canciones);
      }

      function generarCanciones(contenedor, canciones) {
        canciones.forEach((c) => {
          const wrapper = document.createElement("div");
          wrapper.classList.add("cancion-wrapper");

          const div = document.createElement("div");
          div.classList.add("cancion");
          div.innerHTML = `
            <img src="${c.thumbnail}" alt="${c.titulo}">
            <p>${c.titulo}</p>
        `;

          // Botón +
          const btnAgregar = document.createElement("button");
          btnAgregar.textContent = "+";
          btnAgregar.classList.add("btn-agregar");

          const mini = document.createElement("div");
          mini.classList.add("miniPlaylists");

          btnAgregar.addEventListener("click", async (e) => {
            mini.innerHTML = "";
            const res = await api.playlists();
            (res.playlists || []).forEach((pl) => {
              const btnPl = document.createElement("button");
              btnPl.textContent = pl.nombre;
              btnPl.onclick = async () => {
                await api.addSong(pl.id, c);
                mostrarNotificacion(`Se agregó "${c.titulo}" a "${pl.nombre}"`);
                mini.style.display = "none";
              };
              mini.appendChild(btnPl);
            });
            mini.style.display =
              mini.style.display === "flex" ? "none" : "flex";
            mini.style.top = e.target.offsetTop + 30 + "px";
            mini.style.left = e.target.offsetLeft + "px";
          });

          wrapper.appendChild(div);
          wrapper.appendChild(btnAgregar);
          wrapper.appendChild(mini);

          div.addEventListener("click", () => {
            window.parent.frames["reproductorFrame"].postMessage(
              {
                song: c,
              },
              "*"
            );
          });

          contenedor.appendChild(wrapper);
        });
      }

      // 🎩 MAGIA: obtener todas las secciones y generarlas dinámicamente
      const secciones = [...new Set(cancionesCatalogo.map((c) => c.seccion))];

      secciones.forEach((seccion) => {
        const canciones = cancionesCatalogo.filter(
          (c) => c.seccion === seccion
        );
        crearSeccion(seccion, canciones);
      });

      // Quick Playlists
      const qpGrid = document.getElementById("qpGrid");
      // 🔥 guardar últimas visitadas
function getUltimasVisitadas() {
  try {
    return JSON.parse(localStorage.getItem("qp_recent") || "[]");
  } catch {
    return [];
  }
}

function registrarVisitaPlaylist(id) {
  let arr = getUltimasVisitadas();

  arr = arr.filter(x => x !== id);
  arr.unshift(id);
  arr = arr.slice(0, 5);

  localStorage.setItem("qp_recent", JSON.stringify(arr));
}

// 🔥 QUICK PLAYLISTS REAL
async function cargarQuickPlaylists() {
  const grid = document.getElementById("qpGrid");
  if (!grid) return;

  grid.innerHTML = "";

  // ✅ CARD 1 — CREAR PLAYLIST (MISMO SISTEMA QUE BIBLIOTECA)
  const crearCard = document.createElement("div");
  crearCard.className = "qp-card qp-create";
  crearCard.innerHTML = `<div class="qp-title">+ Nueva Playlist</div>`;

  crearCard.addEventListener("click", () => {
    const rect = crearCard.getBoundingClientRect();

    window.parent.postMessage(
      {
        type: "open-create-playlist",
        btnRect: {
          left: rect.left,
          top: rect.top,
          width: rect.width,
          height: rect.height,
        },
      },
      "*"
    );
  });

  grid.appendChild(crearCard);

  // ✅ cargar playlists
  try {
    const r = await api.playlists();
    const todas = r.playlists || [];

    const recientes = getUltimasVisitadas();

    // ordenar: primero las visitadas recientemente
    const ordenadas = [
      ...recientes
        .map(id => todas.find(p => p.id === id))
        .filter(Boolean),
      ...todas.filter(p => !recientes.includes(p.id)),
    ].slice(0, 5);

    ordenadas.forEach((pl) => {
      const card = document.createElement("div");
      card.className = "qp-card";
      card.innerHTML = `<div class="qp-title">${pl.nombre}</div>`;

      card.addEventListener("click", () => {
        registrarVisitaPlaylist(pl.id);

        window.parent.frames["contenidoFrame"].location.href =
          `playlist.html?id=${pl.id}`;
      });

      // 🖱️ click derecho (igual que biblioteca)
card.addEventListener('contextmenu', (ev) => {
  ev.preventDefault();
  ev.stopPropagation();

  try {
    window.parent.postMessage({
      type: 'open-playlist-context',
      id: pl.id,
      name: pl.nombre || '',
      x: ev.clientX,
      y: ev.clientY
    }, '*');
  } catch (e) {}
});



      grid.appendChild(card);
    });
  } catch (e) {
    console.error(e);
    grid.innerHTML =
      `<div style="color:red;">Error al cargar playlists</div>`;
  }
}

      
      document.getElementById("verMasPlaylists").addEventListener("click", () => {
        window.parent.frames[
          "contenidoFrame"
        ].location.href = "biblioteca.html";
      });

      // 🔥 escuchar creación de playlist desde el modal global
// 🔥 escuchar mensajes del parent
window.addEventListener('message', async (ev) => {
  const d = ev.data || {};

  // ==============================
  // ✅ CREAR PLAYLIST
  // ==============================
  if (d.type === 'create-playlist') {
    const nombre = (d.name || '').trim();

    if (!nombre) {
      ev.source.postMessage(
        { type: 'create-playlist-result', ok: false, error: 'Nombre vacío' },
        '*'
      );
      return;
    }

    try {
      const res = await api.createPl(nombre);

      ev.source.postMessage(
        { type: 'create-playlist-result', ok: true, id: res.id },
        '*'
      );

      await cargarQuickPlaylists();
    } catch (e) {
      ev.source.postMessage(
        { type: 'create-playlist-result', ok: false, error: e.error || String(e) },
        '*'
      );
    }
  }

  // ==============================
  // 🖱️ ACCIONES DEL MENÚ CONTEXTUAL
  // ==============================
  if (d.type === 'playlist-action') {
    const id = d.id;
    const action = d.action;

    if (!id || !action) return;

    try {
      if (action === 'rename') {
        const nuevo = prompt('Nuevo nombre para la playlist', d.name || '');
        if (!nuevo) {
          ev.source.postMessage({
            type: 'playlist-action-result',
            ok: false,
            error: 'Nombre vacío'
          }, '*');
          return;
        }

        await api.renamePl(id, nuevo);
        await cargarQuickPlaylists();
        ev.source.postMessage({ type: 'playlist-action-result', ok: true }, '*');

      } else if (action === 'empty') {
        if (!confirm('Vaciar la playlist? Esta acción no se puede deshacer.')) return;

        await api.clearPl(id);
        await cargarQuickPlaylists();
        ev.source.postMessage({ type: 'playlist-action-result', ok: true }, '*');

      } else if (action === 'delete') {
        if (!confirm('Eliminar la playlist? Esta acción no se puede deshacer.')) return;

        await api.delPl(id);
        await cargarQuickPlaylists();
        ev.source.postMessage({ type: 'playlist-action-result', ok: true }, '*');
      }

    } catch (err) {
      console.error(err);
      ev.source.postMessage({
        type: 'playlist-action-result',
        ok: false,
        error: err?.error || String(err)
      }, '*');
    }
  }
});


        window.addEventListener('focus', cargarQuickPlaylists);
        cargarQuickPlaylists();

    </script>
